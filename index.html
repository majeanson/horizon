<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- Browser zoom stays ENABLED on purpose: this is a planner read and corrected by people
         who may need large type, and pinch-zoom is the substitute for everything the in-app
         text-size setting (115 % / 130 %) does not reach. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- FIRST PAINT ONLY. lib/theme.ts rewrites the unscoped tag from the painted --paper as
         soon as it runs, so the chrome tracks the in-app theme. These two media-scoped tags
         just avoid a cream flash on a phone already in dark mode. -->
    <meta name="theme-color" content="#FBF3E4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1712" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FBF3E4" />
    <!-- The description and the link-preview text ship BOTH languages (FR, then EN): a crawler or a search snippet never
         runs a script. The app narrows them to the reader's language once it knows it (lib/documentLang.ts). -->
    <meta name="description" content="Horizon — à quel âge pouvez-vous prendre votre retraite ? Un planificateur pour le Québec, calculé sur les paramètres officiels, dont les données restent sur votre appareil. / At what age can you retire? A planner for Québec, calculated on the official parameters; your data stays on your device." />
    <title>Horizon — Quand pouvez-vous prendre votre retraite ?</title>
    <meta property="og:title" content="Horizon" />
    <meta property="og:description" content="Quand pouvez-vous prendre votre retraite ? Calculé sur les paramètres officiels du Québec et du Canada ; vos données ne quittent jamais votre appareil. / When can you retire? Calculated on the official Québec and Canadian parameters; your data never leaves your device." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Horizon" />
    <meta property="og:locale" content="fr_CA" />
    <meta property="og:locale:alternate" content="en_CA" />
    <!-- The link card is not written here: a crawler needs a FULL address, and this file holds none (lib/noNetwork.test.ts). The Worker adds it
         from the request's origin — the front door's on `/`, a shared result's on /partage (worker/shareRoutes.ts). -->
    <meta name="twitter:card" content="summary" />
    <!-- PWA: installable, offline app shell via /sw.js (registered in src/lib/registerSw.ts,
         prod builds only). Fonts are self-hosted (@fontsource, bundled): not one request
         leaves the origin. -->
    <!-- French manifest by default; lib/documentLang.ts points an English reader at /manifest.en.webmanifest. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Horizon" />
    <!-- Set the theme (and the accessibility profile) before React mounts so a reload never
         flashes the wrong surface. -->
    <script src="/theme-bootstrap.js"></script>
  </head>
  <body>
    <!-- The shell's shape BEFORE a line of the app runs: the bar with the name, and quiet blocks where the first cards
         will be. React replaces all of it on mount (createRoot, not hydration), so nothing here has to match the real
         markup — it only has to look like the page that is coming instead of a blank cream screen. The classes are the
         app's own, so the prod stylesheet (in <head>) dresses it; in dev the stylesheet arrives with the script and the
         skeleton is a plain, unstyled line for a moment, which is fine. -->
    <div id="root">
      <div class="shell">
        <header class="shell__bar"><span class="shell__brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 256 256" width="24" height="24" fill="currentColor" style="display:block"><path d="M240,148H203.89c.07-1.33.11-2.66.11-4a76,76,0,0,0-152,0c0,1.34,0,2.67.11,4H16a12,12,0,0,0,0,24H240a12,12,0,0,0,0-24ZM76,144a52,52,0,0,1,104,0c0,1.34-.07,2.67-.17,4H76.17C76.07,146.67,76,145.34,76,144Zm144,56a12,12,0,0,1-12,12H48a12,12,0,0,1,0-24H208A12,12,0,0,1,220,200ZM12.62,92.21a12,12,0,0,1,15.17-7.59l12,4a12,12,0,1,1-7.58,22.77l-12-4A12,12,0,0,1,12.62,92.21Zm56-48.41a12,12,0,1,1,22.76-7.59l4,12A12,12,0,1,1,72.62,55.8Zm140,60a12,12,0,0,1,7.59-15.18l12-4a12,12,0,0,1,7.58,22.77l-12,4a12,12,0,0,1-15.17-7.59Zm-48-55.59,4-12a12,12,0,1,1,22.76,7.59l-4,12a12,12,0,1,1-22.76-7.59Z"/></svg></span>Horizon</span></header>
        <main class="shell__main">
          <div class="skeleton skeleton--row" aria-hidden="true"><div class="skeleton__block"></div><div class="skeleton__block"></div><div class="skeleton__block"></div></div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
