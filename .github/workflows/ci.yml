name: CI & Deploy

# CI (typecheck · test · build · bundle budgets · dead code) runs on every push to main and every PR, and GATES
# the deploy. Deploy to the Cloudflare Worker is the same `npm run deploy` you run locally, gated
# behind green CI.
#
# E2E (Playwright) lives in its OWN workflow (e2e.yml) and CHAINS off this one via `workflow_run`:
# a push to main ships the moment CI is green, and the slower browser suite runs once afterward
# for signal. It never blocks the deploy — check its run page for visual / flow regressions.

# `push` is main only: a branch with an open PR is already covered by `pull_request`, and running both
# doubled the minutes for every PR branch. (The workflow's own convention is to push straight to main.)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per ref. Cancel superseded branch/PR runs, but never cancel a deploy mid-flight (main
# runs are left to finish).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Size budgets + the load-bearing offline check: every built asset must be in the sw.js
      # precache (the app opens every route offline), EXCEPT the online-only allowlist (the
      # /dev/kit gallery), which must NOT be. See scripts/check-bundle.mjs.
      - run: npm run check:bundle
      # Dead-code gate. knip.json sets `ignoreExportsUsedInFile`, so the report is dead code, not
      # superfluous `export` keywords. It runs here and not on every dev machine: its parser
      # reserves a >4 GiB buffer, which fails on a memory-tight Windows box; a CI runner has the
      # headroom.
      - run: npm run knip

  deploy:
    name: Deploy to Cloudflare
    # Gated on CI only. E2E is intentionally NOT a dependency, so a deploy is not held up by the
    # browser suite.
    needs: [ci]
    # Only the real branch advancing — not PRs, not feature branches.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # Credentials are optional: a repo without the two secrets (a fork, a fresh clone) must not
      # turn the whole workflow RED — e2e.yml chains on this workflow's conclusion, so a failed
      # deploy would silently cancel the browser suite too. Secrets cannot be read in an `if:`,
      # so one step turns their presence into an output the rest key off.
      - name: Is Cloudflare configured?
        id: cf
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set on this repo."
          fi
      - uses: actions/checkout@v7
        if: steps.cf.outputs.ready == 'true'
      - uses: actions/setup-node@v7
        if: steps.cf.outputs.ready == 'true'
        with:
          node-version: 26
          cache: npm
      - run: npm ci
        if: steps.cf.outputs.ready == 'true'
      # `npm run deploy` == build (tsc + vite) then `wrangler deploy`. Wrangler reads the API
      # token + account id from these env vars. There are no bindings and no runtime secrets to
      # configure: the Worker only serves static files.
      - name: Deploy
        if: steps.cf.outputs.ready == 'true'
        shell: bash
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
