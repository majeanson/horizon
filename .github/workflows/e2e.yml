name: E2E (Playwright)

# E2E is DECOUPLED from CI: it CHAINS off the "CI & Deploy" workflow via `workflow_run` and only
# runs once that workflow has concluded SUCCESSFULLY on main — signal after a green merge, without
# ever gating the deploy. Also runnable on demand from the Actions tab (workflow_dispatch).

on:
  workflow_run:
    workflows: ['CI & Deploy']
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One E2E run per source commit; supersede an in-flight run for the same sha.
concurrency:
  group: e2e-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E (Playwright) ${{ matrix.shard }}
    # Pinned to 24.04: ubuntu-latest moved to 26.04 and the pinned Playwright
    # (1.63) host-installs Chromium, which can fail there. Deploy (ci.yml) is
    # browser-free and unaffected; this keeps the decoupled e2e off the 26.04
    # roulette. Lift once Playwright is bumped.
    runs-on: ubuntu-24.04
    # The suite is split in four parallel runners (Playwright's own --shard): the same shape in each — one worker, no retries — so a flake still FAILS and still names the test,
    # but the wall time is a quarter of the whole. A shard that fails does not cancel the others: every failure is reported in one pass.
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4']
    # On the workflow_run path, only proceed if CI actually passed. (A manual workflow_dispatch
    # has no upstream conclusion, so let that through.)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      # workflow_run checks out the default branch by default — pin to the exact commit CI
      # validated so E2E tests the same code (a no-op on dispatch).
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      # Node 26, `npm ci`, and Chromium only (playwright.config.ts) with the Linux system libs the
      # browser needs — the DevHub kit's one setup step (.github/actions/setup).
      - uses: ./.github/actions/setup
        with:
          playwright: 'true'
      # CI's authoritative shape: one worker, no retries — a flake FAILS, and which test flaked
      # is the whole signal. Playwright boots the Vite dev server itself (webServer config);
      # there is no backend to stub.
      - run: npm run e2e:ci -- --shard=${{ matrix.shard }}
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: e2e/report
          retention-days: 7

  # The service-worker offline shell cannot be exercised against the DEV server (no SW there), so
  # it runs under its own harness: `vite build` → `vite preview` serves the real PROD bundle. Its
  # own job, so a failure here is attributable and never waits behind the main suite.
  sw:
    name: E2E (service worker)
    # Pinned to 24.04: ubuntu-latest moved to 26.04 and the pinned Playwright
    # (1.63) host-installs Chromium, which can fail there. Deploy (ci.yml) is
    # browser-free and unaffected; this keeps the decoupled e2e off the 26.04
    # roulette. Lift once Playwright is bumped.
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: ./.github/actions/setup
        with:
          playwright: 'true'
      - run: npm run e2e:sw
      - name: Upload SW harness results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-sw
          path: e2e/test-results-sw
          if-no-files-found: ignore
          retention-days: 7
